behaviors:
   DodgeBallAgent:
       trainer_type: ppo
       time_horizon: 128
       hyperparameters:
           batch_size: 256
           buffer_size: 65536
           learning_rate: 0.0003
           beta: 0.001
           epsilon: 0.2
           lambd: 0.99
           num_epoch: 3
           learning_rate_schedule: linear
       network_settings:
           normalize: false
           hidden_units: 256
           num_layers: 3
       reward_signals:
          extrinsic:
              gamma: 0.99
              strength: 1.0
       max_steps: 1000000
       time_horizon: 128
       summary_freq: 10000